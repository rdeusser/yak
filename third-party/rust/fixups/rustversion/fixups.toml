[buildscript.run.env]
# With this variable set, `rustc --version` prints `rustc 1.999.0-nightly`,
# which rustversion takes for a nightly newer than any date. bytemuck's
# unstable `core::simd` support, which the third-party manifest enables, picks
# the current portable SIMD API only on what rustversion takes for a recent
# nightly. The compiler can be a stable release, because the rules set
# RUSTC_BOOTSTRAP=1 for a toolchain with `nightly_features`.
RUSTC_OVERRIDE_VERSION_STRING = "1.999.0-nightly"
