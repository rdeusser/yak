[pytest]
# `tests/` is the import root, so test modules import the harness as `e2e_util`.
pythonpath = .
testpaths = core e2e prelude select_type_params tools
python_files = test_*.py
# Test data directories hold build files and scripts for yak, not pytest
# modules. The list replaces pytest's default, which would skip `core/build`.
norecursedirs = *_data .* yak-out __pycache__
# importlib mode lets test modules in different directories share a file name.
addopts = --import-mode=importlib --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# pytest-timeout fails a test after this many seconds. It matches the test
# timeout that the harness passes to yak in YAK_SELF_TEST_TIMEOUT_S.
timeout = 600
markers =
    yak_test: carries the settings of @yak_test() to the yak fixture
    remote_execution: needs a Remote Execution backend, runs only when YAK_TEST_RE_CONFIG is set
    remote_cache: needs a remote cache, runs only when YAK_TEST_REMOTE_CACHE_CONFIG is set
    cgroups: lets the daemon create cgroups with `systemd-run --user`, runs only when YAK_TEST_CGROUPS=1
    needs_binary(*env_vars): runs helper binaries named by the environment variables, skipped when one is unset
