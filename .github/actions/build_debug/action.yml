name: build_debug
description: Build yak binary (debug)
runs:
  using: composite
  steps:
  - uses: Swatinem/rust-cache@v2
    with:
      prefix-key: yak-debug
  - name: Build yak binary (debug)
    run: |-
      mkdir $RUNNER_TEMP/artifacts
      cargo build --bin=yak -Z unstable-options --artifact-dir=$RUNNER_TEMP/artifacts
    shell: bash
