name: build_release
description: Build yak binary (release)
runs:
  using: composite
  steps:
  - uses: Swatinem/rust-cache@v2
    with:
      prefix-key: buck2-release
  - name: Build yak binary (release)
    run: |-
      mkdir $RUNNER_TEMP/artifacts
      cargo build --bin=yak --release -Z unstable-options --artifact-dir=$RUNNER_TEMP/artifacts
    shell: bash
