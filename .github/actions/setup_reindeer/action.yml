name: setup_reindeer
runs:
  using: composite
  steps:
  - name: Install Reindeer
    run: |-
      cargo install --locked --git https://github.com/facebookincubator/reindeer reindeer
      # Remove any dirty BUCK and Cargo.lock files
      rm -f third-party/rust/Cargo.lock third-party/rust/BUCK
      reindeer --third-party-dir third-party/rust buckify
    shell: bash
