name: setup_macos_env
description: Setup macOS environment
runs:
  using: composite
  steps:
  - uses: SebRollen/toml-action@v1.2.0
    id: read_rust_toolchain
    with:
      file: rust-toolchain.toml
      field: toolchain.channel
  - uses: dtolnay/rust-toolchain@v1
    with:
      toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
      components: clippy
  - name: Brew install
    run: brew install cmake python3 coreutils opam llvm protobuf zstd
    shell: bash
  - name: Install uv
    uses: astral-sh/setup-uv@v5
  - name: Install conan
    run: uv tool install conan==1.*
    shell: bash
  - uses: "./.github/actions/print_versions"
  # The prelude's Go tools need Go 1.23 or later (`os.CopyFS` in
  # `prelude/go/tools/copy_goroot.go`), and its Go rules follow Go 1.26
  # (`prelude/go/package_builder.bzl`).
  - uses: actions/setup-go@v5
    with:
      cache: false
      go-version: '~1.26.0'
  - uses: haskell-actions/setup@v2
    with:
      ghc-version: '9.10.1'
