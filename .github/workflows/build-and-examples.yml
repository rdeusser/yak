name: Build and Examples
on:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  macos-build-examples:
    # Pinned to macos-14: on the macos-15 runner image `latest-stable` selects an
    # Xcode/SDK that mis-targets the deployment SDK and breaks the `cargo build`
    # step (actions/runner-images#12758). macos-14 resolves to a known-good Xcode 16.x.
    runs-on: macos-14
    steps:
    - uses: maxim-lobanov/setup-xcode@v1.6.0
      with:
        xcode-version: latest-stable
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_macos_env
    - uses: ./.github/actions/init_opam
    - uses: ./.github/actions/build_release
    - name: Setup the 'example/with_prelude' project
      run: |-
        cd examples/with_prelude
        ./haskell-setup.sh
        ./ocaml-setup.sh
    - name: Build the 'example/with_prelude' project
      run: |-
        cd examples/with_prelude
        $RUNNER_TEMP/artifacts/yak build //... -v 2
        $RUNNER_TEMP/artifacts/yak test //... -v 2
    - uses: ./.github/actions/build_example_no_prelude
    - uses: ./.github/actions/build_example_toolchain
      with:
        toolchain: python_toolchain
    - uses: ./.github/actions/build_example_toolchain
      with:
        toolchain: go_toolchain
    - uses: ./.github/actions/build_example_toolchain
      continue-on-error: true
      with:
        toolchain: cxx_zig_toolchain
    - uses: ./.github/actions/setup_reindeer
    - uses: ./.github/actions/build_bootstrap
  linux-build-examples:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_linux_env
    - uses: ./.github/actions/init_opam
    - uses: ./.github/actions/build_release
    - name: Setup the 'example/with_prelude' project
      run: |-
        cd examples/with_prelude
        ./haskell-setup.sh
        ./ocaml-setup.sh
    - name: Build the 'example/with_prelude' project
      run: |-
        cd examples/with_prelude
        $RUNNER_TEMP/artifacts/yak build //... -v 2
        $RUNNER_TEMP/artifacts/yak test //... -v 2
    - uses: ./.github/actions/build_example_conan
    - uses: ./.github/actions/build_example_no_prelude
    - uses: ./.github/actions/build_example_toolchain
      with:
        toolchain: python_toolchain
    - uses: ./.github/actions/build_example_toolchain
      with:
        toolchain: go_toolchain
    - uses: ./.github/actions/build_example_toolchain
      continue-on-error: true
      with:
        toolchain: cxx_zig_toolchain
    - uses: ./.github/actions/build_example_persistent_worker
      with:
        buildbuddyApiKey: ${{ secrets.BUILDBUDDY_API_KEY }}
    - uses: ./.github/actions/setup_reindeer
    - uses: ./.github/actions/build_bootstrap
  windows-build-examples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup_windows_env
      - uses: ./.github/actions/build_release
      - name: Build example/prelude directory
        run: |-
          cd examples/with_prelude
          & $Env:RUNNER_TEMP/artifacts/yak build //... -v 2
          & $Env:RUNNER_TEMP/artifacts/yak test //... -v 2
      - uses: ./.github/actions/build_example_no_prelude
      - uses: ./.github/actions/build_example_toolchain
        with:
          toolchain: python_toolchain
      - uses: ./.github/actions/build_example_toolchain
        with:
          toolchain: go_toolchain
      - uses: ./.github/actions/build_example_toolchain
        continue-on-error: true
        with:
          toolchain: cxx_zig_toolchain
      - uses: ./.github/actions/setup_reindeer
      - uses: ./.github/actions/build_bootstrap
