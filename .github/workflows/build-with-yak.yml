name: Build yak with yak
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  linux-build-with-yak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6
    - uses: SebRollen/toml-action@v1.2.0
      id: read_rust_toolchain
      with:
        file: rust-toolchain.toml
        field: toolchain.channel
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
    # The Cargo build and the yak build each keep a debug build of the binary
    # and its dependencies, which together need more than the runner's free
    # disk. The job uses none of these preinstalled tools.
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      shell: bash
    - uses: ./.github/actions/build_debug
    # `test_yak_dep_graph` checks the crate dependency rules of
    # `app_dep_graph_rules/rules.bzl` during analysis. The compile of
    # `starlark` peaks at 5 GB on Linux, so 2 jobs keep the build within the
    # runner's 16 GB.
    - name: Build yak and check the crate dependency rules
      run: $RUNNER_TEMP/artifacts/yak build //app/yak:yak //app_dep_graph_rules:test_yak_dep_graph -j 2
      shell: bash
